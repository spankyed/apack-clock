name: CI

# Every push to master and every pull request runs the suite on Linux, macOS and Windows, plus real Chromium browser
# checks and 100% mutation testing: a clock runs in a window and in Node on all three. A newer push to the same branch
# or pull request cancels the run before it.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The oldest TypeScript the package and its specs are held to
      - run: npm run typecheck:floor
      - run: npm run build
      - run: npm test
      - run: npm run workflows:check
      # Build determinism (byte-for-byte), emitted size ceilings, and steady-state timer cost.
      - run: npm run package:check
      # The package as a consumer gets it: packed, installed elsewhere, typechecked on TS 5.7, and the README example run.
      - run: npm run package:smoke
      # The packed package as published code: its manifest and files (publint), and each entry's types (attw).
      - run: npm run package:lint

  # The clock's specs in real browser engines and dedicated Web Workers: Chromium, Firefox, and WebKit via vitest's
  # browser mode and Playwright, proving real MessageChannel, performance.now(), setTimeout, and AbortSignal behavior.
  browser:
    name: browser (chromium, firefox, webkit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Browsers are kept between runs for the Playwright that installs them; system deps are installed each time.
      - id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-all-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox webkit
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium firefox webkit
      - run: npm run test:browser

  # Every mutant of the source, run against the specs: one that survives fails.
  mutants:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run mutants

  # The one check a release waits on: every job above passed.
  ci-pass:
    if: always()
    needs: [suite, browser, mutants]
    runs-on: ubuntu-24.04
    steps:
      - run: test "${{ needs.suite.result }}" = "success" -a "${{ needs.browser.result }}" = "success" -a "${{ needs.mutants.result }}" = "success"
